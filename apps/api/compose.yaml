services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: sprintdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sprintdesk
    volumes:
      - sprintdesk_pgdata:/var/lib/postgresql/data

volumes:
  sprintdesk_pgdata: